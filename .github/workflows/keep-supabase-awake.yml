# Free Supabase projects are paused after 7 days without activity, and a paused
# database means the shop loads nothing until it is woken by hand. A single
# daily read is enough to count as activity.
#
# It must query Supabase directly. Pinging dinasstudio.com would not do it:
# that serves cached static HTML from Cloudflare's edge, and the database call
# happens in the visitor's browser, which a pinger never runs.
#
# Deliberately a read. Never automate an order to keep this alive — every order
# marks a one-of-a-kind piece sold out, emails a customer, and spends real
# stock.
name: Keep Supabase awake

on:
  schedule:
    - cron: '0 6 * * *'   # 10:00 in Dubai, daily
  workflow_dispatch:       # and on demand, from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read the connection details out of the client the site already ships,
      # so there is one place to change if the key is ever rotated, and no
      # repository secret to keep in step. This key is public by design; row
      # level security is what protects the data.
      - name: Query the database
        run: |
          set -euo pipefail
          url=$(sed -n "s/^const SUPABASE_URL = '\(.*\)';$/\1/p" public/js/supabaseClient.js)
          key=$(sed -n "s/^const SUPABASE_ANON_KEY = '\(.*\)';$/\1/p" public/js/supabaseClient.js)
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "Could not read the Supabase details from public/js/supabaseClient.js"
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "apikey: $key" -H "Authorization: Bearer $key" \
            "$url/rest/v1/products?select=id&limit=1")
          echo "Supabase answered $code"
          # Anything other than 200 is worth an email from GitHub: the project
          # may already be paused, or the key may have been rotated.
          [ "$code" = "200" ]
